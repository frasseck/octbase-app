<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#006C4F">
<title>Octbase Mobile</title>
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon.ico" sizes="any">
<link rel="preload" href="fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Synchronous (no defer), before the stylesheet, so the saved theme applies
     before CSS paints; kept external (not inline) so the Caddy CSP needs no
     'unsafe-inline' for scripts. -->
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/mobile.css">
<!-- Everything below theme-init.js is deferred, so none of it blocks first
     paint. The app is ES modules bundled by Vite (37b stage 2): app.js is the
     entry and imports core.js and the @octbase/shared modules (i18n, task
     metadata and the rich-text sanitizer), which until 37b stage 3 were
     classic script tags here — as were DOMPurify and the QR generator until
     stage 4, when they became the `dompurify` and `qrcode-generator` npm
     packages. There is no load order left in this file to keep in step.
     The standalone demo, which is opened from disk and cannot use `import`, is a
     separate build target — `npm run build:standalone`, output in
     dist-standalone/. -->
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app-root">
  <div class="boot"><div class="spinner"></div></div>
</div>
<div id="toast-container" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
