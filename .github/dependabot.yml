# Dependabot — closes the gap called out in ci.yml's dependency-audit step:
# `npm audit --omit=dev` gates only runtime deps, so advisories against the dev
# tree (vite, eslint, vitest, …) surface here instead of blocking CI.
version: 2
updates:
  # npm workspaces — the ROOT ONLY, deliberately.
  #
  # octbase-shared, octbase-frontend and octbase-mobile are workspaces of the
  # root package.json, so there is exactly one lockfile and it lives here.
  # Dependabot understands that: the root entry edits the workspace manifests
  # AND package-lock.json in one PR.
  #
  # Listing the workspaces individually as well produced a PR per manifest for
  # any shared dependency, and the per-workspace ones were unmergeable by
  # construction — they bumped a workspace package.json while leaving the root
  # lockfile untouched, so `npm ci` refused them:
  #
  #   npm error `npm ci` can only install packages when your package.json and
  #   npm error package-lock.json are in sync.
  #   npm error Missing: qrcode-generator@2.0.4 from lock file
  #
  # That is what qrcode-generator 1.4.4 → 2.0.4 did on 2026-08-02: three PRs,
  # of which only the root one (#6) was correct and complete; #9 and #10 were
  # closed as superseded after burning CI on a failure they could never fix.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # TypeScript majors are held back until openapi-typescript can take one.
      # `npm run types:generate` runs openapi-typescript, whose every published
      # release (7.13.0 is latest as of 2026-08-02) declares
      # `peer typescript: "^5.x"`. A TS 7 bump therefore fails `npm ci` outright
      # with ERESOLVE — that is what PR #8 did — and forcing it past the peer
      # would risk the types-generation guard itself, since TS 7 is the rewritten
      # compiler and openapi-typescript drives the compiler API.
      #
      # TypeScript here is dev-only and narrow: openapi-typescript, plus
      # `tsc --noEmit` over the three `// @ts-check` files. There is nothing to
      # gain from 7 until upstream moves.
      #
      # REVISIT when openapi-typescript publishes a release whose peer range
      # admits TypeScript 7, then drop this block and let the bump through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Go backend.
  - package-ecosystem: gomod
    directory: "/octbase-api"
    schedule:
      interval: weekly

  # CI workflow actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
