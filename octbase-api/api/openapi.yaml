      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCategory' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete: { tags: [Categories], summary: Delete a task category, operationId: deleteTaskCategory, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/projects/{projectId}/task-priorities:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get: { tags: [Categories], summary: List the project's custom priorities (built-ins live in /meta/enums), operationId: listTaskPriorities, responses: { '200': { description: Custom priorities, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProjectPriority' } } } } } } }
    post:
      tags: [Categories]
      summary: Add a custom priority (project admins only)
      operationId: createTaskPriority
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, description: 'Normalized to UPPER_SNAKE; must not collide with a built-in priority' }, rank: { type: integer } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProjectPriority' } } } }, '409': { description: 'PRIORITY_EXISTS — duplicate name' }, '422': { description: 'INVALID_PRIORITY_NAME or PRIORITY_RESERVED' } }
  /api/v1/task-priorities/{priorityId}:
    parameters: [ { name: priorityId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete: { tags: [Categories], summary: Delete a custom priority (project admins only; 422 PRIORITY_IN_USE while tasks/templates use it), operationId: deleteTaskPriority, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' }, '422': { description: 'PRIORITY_IN_USE' } } }
  /api/v1/projects/{projectId}/task-templates:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get: { tags: [Categories], summary: List task templates, operationId: listTaskTemplates, responses: { '200': { description: Templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskTemplate' } } } } } } }
    post:
      tags: [Categories]
      summary: Create a task template
      operationId: createTaskTemplate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } } }
  /api/v1/task-templates/{templateId}:
    parameters: [ { name: templateId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get: { tags: [Categories], summary: Get a task template, operationId: getTaskTemplate, responses: { '200': { description: Template, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch:
      tags: [Categories]
      summary: Update a task template
      operationId: updateTaskTemplate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TaskTemplate' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete: { tags: [Categories], summary: Delete a task template, operationId: deleteTaskTemplate, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/task-templates/{templateId}/instantiate:
    parameters: [ { name: templateId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [Categories]
      summary: Create a task from a template
      operationId: instantiateTaskTemplate
      responses: { '201': { description: Task created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, '404': { $ref: '#/components/responses/NotFound' } }

  # ───────────────────────── Docs ─────────────────────────
  /api/v1/projects/{projectId}/pages:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get: { tags: [Docs], summary: List wiki pages, operationId: listPages, responses: { '200': { description: Pages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Page' } } } } } } }
    post:
      tags: [Docs]
      summary: Create a wiki page
      operationId: createPage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [title], properties: { title: { type: string }, content: { type: string }, parentPageId: { type: string, format: uuid } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } } }
  /api/v1/projects/{projectId}/search/pages:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Search]
      summary: Search wiki pages in a project
      operationId: searchPages
      # Shorter than minLength answers 200 with an empty result set rather than an
      # error: pg_trgm extracts no trigram below 3 characters, so a 1- or 2-character
      # pattern cannot use the GIN indexes and would sequentially scan.
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 500 } } ]
      responses: { '200': { description: Matching pages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Page' } } } } } }
  /api/v1/pages/{pageId}:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    get: { tags: [Docs], summary: Get a page, operationId: getPage, responses: { '200': { description: Page, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch:
      tags: [Docs]
      summary: Update a page (creates a revision)
      description: >-
        Applies title/content/slug (with version for the optimistic lock).
        Unknown keys are rejected with 400 UNSUPPORTED_FIELD — status in
        particular changes only via POST /pages/{pageId}/publish or /archive.
      operationId: updatePage
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete: { tags: [Docs], summary: Delete a page, operationId: deletePage, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/pages/{pageId}/publish:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    post: { tags: [Docs], summary: Publish a page, operationId: publishPage, responses: { '200': { description: Published, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/pages/{pageId}/archive:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    post: { tags: [Docs], summary: Archive a page, operationId: archivePage, responses: { '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /api/v1/pages/{pageId}/render-preview:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    post:
      tags: [Docs]
      summary: Render AsciiDoc to HTML without saving
      operationId: renderPreview
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { content: { type: string } } } } } }
      responses: { '200': { description: Rendered HTML } }
  /api/v1/pages/{pageId}/revisions:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    get: { tags: [Docs], summary: List page revisions, operationId: listPageRevisions, responses: { '200': { description: Revisions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PageRevision' } } } } } } }
  /api/v1/pages/{pageId}/references:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    get: { tags: [Docs], summary: List task cross-references for a page, operationId: listPageReferences, responses: { '200': { description: References, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PageReference' } } } } } } }
  /api/v1/pages/{pageId}/references/rebuild:
    parameters: [ { $ref: '#/components/parameters/pageId' } ]
    post: { tags: [Docs], summary: Rebuild task cross-references from page content, operationId: rebuildPageReferences, responses: { '200': { description: Rebuilt }, '404': { $ref: '#/components/responses/NotFound' } } }

  # ───────────────────────── SCM ─────────────────────────
  /api/v1/projects/{projectId}/repository-connections:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get: { tags: [SCM], summary: List repository connections, operationId: listRepositoryConnections, responses: { '200': { description: Connections, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RepositoryConnection' } } } } } } }
    post:
      tags: [SCM]
      summary: Create a repository connection
      operationId: createRepositoryConnection
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [provider, repositoryUrl], properties: { provider: { $ref: '#/components/schemas/Provider' }, displayName: { type: string }, repositoryUrl: { type: string }, defaultBranch: { type: string } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryConnection' } } } } }
  /api/v1/repository-connections/{repositoryId}:
    parameters: [ { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [SCM]
      summary: Update a repository connection
      operationId: updateRepositoryConnection
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryConnection' } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryConnection' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
    delete: { tags: [SCM], summary: Delete a repository connection, operationId: deleteRepositoryConnection, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/repository-connections/{repositoryId}/oauth/authorize:
    parameters: [ { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [SCM]
      summary: Begin the OAuth authorization flow for a repository connection
      operationId: oauthAuthorize
      description: Returns the provider authorization URL for the client to redirect the user to. Requires project owner.
      responses:
        '200': { description: Authorization URL, content: { application/json: { schema: { type: object, properties: { authorizeUrl: { type: string } } } } } }
        '400': { description: OAuth not configured for the provider, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repository-connections/{repositoryId}/oauth/refresh:
    parameters: [ { name: repositoryId, in: path, required: true, schema: { type: string, format: uuid } } ]
    post:
      tags: [SCM]
      summary: Refresh the OAuth access token for a repository connection
      operationId: oauthRefresh
      responses:
        '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/RepositoryConnection' } } } }
        '400': { description: Connection has no OAuth refresh token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/oauth/{provider}/callback:
    parameters: [ { name: provider, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [SCM]
      summary: OAuth provider redirect callback
      operationId: oauthCallback
      description: Exchanges the authorization code, stores the token, and redirects to OCTBASE_APP_URL when set (otherwise returns JSON).
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Connected, content: { application/json: { schema: { type: object, properties: { connected: { type: boolean } } } } } }
        '302': { description: Redirect to the application after a successful connection }
        '400': { description: Missing/invalid code or state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Search ─────────────────────────
  /api/v1/search:
    get:
      tags: [Search]
      summary: Global cross-project search (command palette)
      operationId: globalSearch
      # Shorter than minLength answers 200 with an empty result set rather than an
      # error: pg_trgm extracts no trigram below 3 characters, so a 1- or 2-character
      # pattern cannot use the GIN indexes and would sequentially scan.
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 500 } } ]
      responses: { '200': { description: Mixed search results } }

  # ───────────────── Import / export (project ZIP) ─────────────────
  /api/v1/projects/import:
    post:
      tags: [Projects]
      summary: Create a new project from a project export archive (ADMIN+, supports dryRun)
      operationId: importProjectAsNew
      parameters: [ { name: dryRun, in: query, schema: { type: boolean } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { description: Created project plus import result }, '200': { description: Dry-run preview (nothing persisted) }, '400': { description: Invalid archive (IMPORT_ARCHIVE_INVALID, IMPORT_FORMAT_UNSUPPORTED, IMPORT_TOO_LARGE) }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/projects/{projectId}/export:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Projects]
      summary: Export the whole project as a re-importable ZIP archive
      description: >
        The archive carries the project's tasks with their comments, links and
        attachments (file bytes included), the task relations, the doc pages,
        and the planning structure the tasks are placed in: releases, sprints,
        boards with their lanes, task categories and task templates. Each task
        keeps its releaseId, sprintId, boardColumnId and boardRank, so an import
        restores the placement rather than a flat backlog.


        Deliberately not exported: project memberships (an archive must not hand
        out access), SCM repository connections (they hold credentials), board
        columns mirrored from other projects, and the activity/audit log.
      operationId: exportProject
      responses: { '200': { description: ZIP archive, content: { application/zip: {} } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/projects/{projectId}/import:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [Projects]
      summary: Import a project export archive into this project (supports dryRun)
      operationId: importProject
      parameters: [ { name: dryRun, in: query, schema: { type: boolean } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: Import result (or dry-run preview) }, '400': { description: Invalid archive (IMPORT_ARCHIVE_INVALID, IMPORT_FORMAT_UNSUPPORTED, IMPORT_TOO_LARGE) }, '403': { $ref: '#/components/responses/Forbidden' } }

  # ───────────────── Import / export (CSV) ─────────────────
  /api/v1/projects/{projectId}/export/jira-csv:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Tasks]
      summary: Export project tasks as Jira-compatible CSV
      description: >
        Emits the fixed Jira columns plus repeating Comment columns and, for
        URL-backed attachments, repeating Attachment columns in Jira's
        "date;author;filename;URL" format, so an Octbase→Octbase round-trip
        preserves comments and external attachment links. Uploaded (binary)
        attachments are not exported — they have no public URL.
      operationId: exportJiraCsv
      responses: { '200': { description: CSV file, content: { text/csv: {} } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/projects/{projectId}/import/jira-csv:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    post:
      tags: [Tasks]
      summary: Import tasks from a Jira CSV (supports dryRun)
      description: >
        Edition-gated (OCTBASE_EDITION): included in ENTERPRISE, activatable
        in BUSINESS as an additional option (OCTBASE_OPTION_JIRA_IMPORT=true),
        never available in TEAM. When not activated the endpoint answers 403
        with the stable code FEATURE_DISABLED; the SPA hides its menu entry
        via the features.jiraCsvImport flag from GET /api/v1/config.

        Repeating Attachment columns ("date;author;filename;URL") become
        URL-backed attachment records pointing at the original Jira URL; the
        bytes are never fetched server-side (the URLs require Jira access, and
        fetching them would be an SSRF surface). The response is an import
        report: counts (imported, attachmentsImported, skipped) plus per-row
        errors and warnings ({row, issueKey, message} — unknown status/
        priority/type fallbacks, unmapped users, malformed attachment or
        comment cells), capped at 200 warning details. A real (non-dry-run)
        import also writes one project-level activity entry summarising the
        run.
      operationId: importJiraCsv
      parameters: [ { name: dryRun, in: query, schema: { type: boolean } } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: Import report (or dry-run preview) with counts, per-row errors, and warnings }, '403': { $ref: '#/components/responses/Forbidden' } }

  # ───────────────────────── Realtime ─────────────────────────
  /api/v1/projects/{projectId}/events:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Realtime]
      summary: Server-Sent Events stream for a project
      operationId: projectEvents
      description: >-
        Live event stream for project members. Accepts the access token via the
        `Authorization` header or a `?token=` query parameter (for EventSource
        clients). Each message `data` is a JSON object with a `type` field.
        Emitted types: `notification.created` (an in-app notification for the
        connected user) and `board.changed` (any co-worker mutation to the
        project — carries `activityType`, `actorId`, and, when task-scoped,
        `taskId`; clients use it to auto-refresh an open board/task panel).
      security:
        - bearerAuth: []
        - {}
      parameters: [ { name: token, in: query, schema: { type: string } } ]
      responses: { '200': { description: SSE stream, content: { text/event-stream: {} } } }
  /api/v1/projects/{projectId}/presence:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Realtime]
      summary: Currently-present users in a project
      operationId: projectPresence
      responses: { '200': { description: Presence list } }

  # ───────────────────────── Webhooks ─────────────────────────
  /api/v1/webhooks/bitbucket:
    post:
      tags: [Webhooks]
      summary: Bitbucket webhook receiver (HMAC-SHA256)
      operationId: bitbucketWebhook
      security: []
      description: Authenticated via the `X-Hub-Signature-256` HMAC header; rejects on mismatch.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '204': { description: Accepted }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/v1/webhooks/github:
    post:
      tags: [Webhooks]
      summary: GitHub webhook receiver (HMAC-SHA256)
      operationId: githubWebhook
      security: []
      description: Authenticated via the `X-Hub-Signature-256` HMAC header; rejects on mismatch.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '204': { description: Accepted }, '401': { $ref: '#/components/responses/Unauthorized' } }
