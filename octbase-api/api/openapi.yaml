      operationId: addColumn
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, status: { type: string, description: 'Task status this lane represents (defaults to PLANNED). A custom status becomes assignable to the project''s tasks; unique per board.' }, position: { type: integer } } } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BoardColumn' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/boards/{boardId}/columns/{columnId}:
    parameters: [ { $ref: '#/components/parameters/boardId' }, { name: columnId, in: path, required: true, schema: { type: string, format: uuid } } ]
    patch:
      tags: [Boards]
      summary: Rename/re-status/reorder a column
      operationId: updateColumn
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { name: { type: string }, status: { type: string, description: 'Task status this lane represents; changing it retags the lane''s non-DONE/ARCHIVED tasks to the new status. Unique per board.' }, position: { type: integer }, version: { type: integer, description: Optional column version the edit is based on; a stale version is rejected with 409 VERSION_CONFLICT } } } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BoardColumn' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } }
    delete: { tags: [Boards], summary: Delete a column. The lane's tasks are detached back to the backlog (they keep their status)., operationId: deleteColumn, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/boards/{boardId}/external-columns:
    parameters: [ { $ref: '#/components/parameters/boardId' } ]
    get: { tags: [Boards], summary: List external columns, operationId: listExternalColumns, responses: { '200': { description: External columns, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BoardExternalColumn' } } } } } } }
    post:
      tags: [Boards]
      summary: Map a lane to an external (SCM) state
      operationId: addExternalColumn
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BoardExternalColumn' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BoardExternalColumn' } } } } }
  /api/v1/boards/{boardId}/external-columns/{externalColumnId}:
    parameters: [ { $ref: '#/components/parameters/boardId' }, { name: externalColumnId, in: path, required: true, schema: { type: string, format: uuid } } ]
    delete: { tags: [Boards], summary: Delete an external column, operationId: deleteExternalColumn, responses: { '204': { description: Deleted }, '404': { $ref: '#/components/responses/NotFound' } } }
  /api/v1/boards/{boardId}/move-task:
    parameters: [ { $ref: '#/components/parameters/boardId' } ]
    post:
      tags: [Boards]
      summary: Move a task to a column / rank on the board
      description: >-
        The task adopts the target lane's status (422 TASK_IMMUTABLE when a
        DONE/ARCHIVED task would change status — reordering within its lane is
        still allowed; 422 TASK_HAS_BLOCKER when moving into a DONE lane while
        a child holds BLOCKER priority).
        Moving a task onto a sprint board enrolls it in that board's sprint.
        Once the sprint is ACTIVE its scope is locked, so a task not already in
        the sprint cannot be added (422 SPRINT_SCOPE_LOCKED); tasks already in
        the sprint may still be moved between lanes.
      operationId: moveTask
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [taskId, boardColumnId], properties: { taskId: { type: string, format: uuid }, boardColumnId: { type: string, format: uuid }, boardRank: { type: integer }, version: { type: integer, description: Optional task version the move is based on; a stale version is rejected with 409 VERSION_CONFLICT } } } } } }
      responses: { '200': { description: Moved }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Unprocessable' } }
  /api/v1/boards/{boardId}/remove-task:
    parameters: [ { $ref: '#/components/parameters/boardId' } ]
    post:
      tags: [Boards]
      summary: Remove a task from the board
      operationId: removeTaskFromBoard
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [taskId], properties: { taskId: { type: string, format: uuid } } } } } }
      responses: { '200': { description: Removed }, '404': { $ref: '#/components/responses/NotFound' } }

