      responses: { '200': { description: Completed, content: { application/json: { schema: { $ref: '#/components/schemas/Sprint' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { $ref: '#/components/responses/Unprocessable' } }

  # ───────────────────────── Reports ─────────────────────────
  /api/v1/sprints/{sprintId}/burndown:
    parameters: [ { name: sprintId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      tags: [Reports]
      summary: Burndown for an ACTIVE or COMPLETED sprint, by task count or effort
      description: >
        One point per calendar day (UTC) of the sprint window: remaining =
        the committed work not yet DONE/ARCHIVED at the end of that day,
        reconstructed on read from activity_entries status transitions (with
        tasks.done_at as fallback), plus the ideal straight line from
        committed to 0. `unit` selects what is measured — `tasks` (the
        default) counts tickets, `points`/`hours` burn down the estimates
        themselves. An effort unit must match the project's active
        estimationUnit; asking for one it does not use is 422
        ESTIMATION_UNIT_INACTIVE rather than a silent fall back to counting.
        Unestimated committed tasks weigh 0 and are reported in
        `unestimated`. `unit` and `unestimated` appear only for an effort
        request, so `?unit=tasks` and the no-param call are byte-identical to
        what clients consumed before effort existed. For an ACTIVE sprint,
        days in the future have remaining = null. History recorded before the
        1.0.x status payloads lacks them on some transition kinds, so older
        burndowns render approximately; the reconstruction also relies on
        activity retention (OCTBASE_ACTIVITY_RETENTION_DAYS, default 365)
        covering the sprint window. Requires project membership.
      operationId: sprintBurndown
      parameters:
        - name: unit
          in: query
          schema: { type: string, enum: [tasks, points, hours], default: tasks }
      responses:
        '200':
          description: Burndown series
          content:
            application/json:
              schema:
                type: object
                properties:
                  sprintId: { type: string, format: uuid }
                  name: { type: string }
                  status: { type: string, enum: [ACTIVE, COMPLETED] }
                  startDate: { type: string, format: date }
                  endDate: { type: string, format: date }
                  committed: { type: number, description: Committed task count, or committed effort for an effort unit }
                  unit: { type: string, enum: [points, hours], description: Echoed back for an effort request only, so a chart cannot mislabel its axis }
                  unestimated: { type: integer, description: Committed tasks carrying no estimate (effort requests only) }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        remaining: { type: number, nullable: true }
                        ideal: { type: number }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Sprint has not started (SPRINT_NOT_STARTED), or the requested unit is not the project's active estimation unit (ESTIMATION_UNIT_INACTIVE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/projects/{projectId}/reports/velocity:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Reports]
      summary: Velocity of the last N completed sprints
      description: >
        The last N (default 6, cap 20) COMPLETED sprints as
        committed/completed pairs, oldest first — a projection of the values
        snapshotted at sprint completion. Every sprint reports task counts;
        one completed while the project was estimating additionally reports
        committedEstimate/completedEstimate and the estimateUnit they were
        measured in. The unit is stored per sprint, so switching the project
        from POINTS to HOURS never relabels or recomputes a historical
        sprint — and a mixed-unit history must be rendered as such rather
        than summed. Requires project membership.
      operationId: projectVelocity
      parameters: [ { name: n, in: query, schema: { type: integer, default: 6, maximum: 20 } } ]
      responses:
        '200':
          description: Velocity entries, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sprintId: { type: string, format: uuid }
                    name: { type: string }
                    endDate: { type: string, format: date, nullable: true }
                    committed: { type: integer }
                    completed: { type: integer }
                    committedEstimate: { type: number, nullable: true }
                    completedEstimate: { type: number, nullable: true }
                    estimateUnit: { type: string, enum: [POINTS, HOURS], nullable: true }
  /api/v1/projects/{projectId}/reports/statistics:
    parameters: [ { $ref: '#/components/parameters/projectId' } ]
    get:
      tags: [Reports]
      summary: Project statistics overview for a project manager
      description: >
        Everything the statistics page draws, in one read-time projection —
        no snapshot table and no scheduled job. Task totals and the
        status/type/priority distributions (empty buckets included, in the
        domain's own order, so a chart keeps its shape between reloads);
        overdue, due-soon and unassigned counts over OPEN tasks only; the
        30-day created/completed flow; weekly throughput for the last 8
        weeks; average and median cycle time from creation to DONE over the
        last 90 days; open work per assignee; the active sprint; and the
        release plan. `effort` is null unless the project estimates, so zeros
        can never be mistaken for "nothing left to do". Requires project
        membership — the numbers aggregate exactly what a member can already
        read task by task.
      operationId: projectStatistics
      responses:
        '200':
          description: Project statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  projectId: { type: string, format: uuid }
                  generatedAt: { type: string, format: date-time }
                  estimationUnit: { type: string, enum: [NONE, POINTS, HOURS] }
                  tasks:
                    type: object
                    properties:
                      total: { type: integer }
                      open: { type: integer }
                      inProgress: { type: integer }
                      done: { type: integer }
                      archived: { type: integer }
                      unassigned: { type: integer }
                      overdue: { type: integer }
                      dueSoon: { type: integer }
                      createdLast30: { type: integer }
                      completedLast30: { type: integer }
                      byStatus: { $ref: '#/components/schemas/CountDistribution' }
                      byType: { $ref: '#/components/schemas/CountDistribution' }
                      byPriority: { $ref: '#/components/schemas/CountDistribution' }
                  effort:
                    type: object
                    nullable: true
                    properties:
                      unit: { type: string, enum: [POINTS, HOURS] }
                      total: { type: number }
                      done: { type: number }
                      remaining: { type: number }
                      unestimated: { type: integer }
                  throughput:
                    type: array
                    items:
                      type: object
                      properties:
                        weekStart: { type: string, format: date }
                        completed: { type: integer }
                        effort: { type: number, nullable: true }
                  cycleTime:
                    type: object
                    properties:
                      sampleSize: { type: integer }
                      averageDays: { type: number, nullable: true }
                      medianDays: { type: number, nullable: true }
                  workload:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        name: { type: string }
                        open: { type: integer }
                        effort: { type: number, nullable: true }
                  sprint:
                    type: object
                    nullable: true
                    properties:
                      sprintId: { type: string, format: uuid }
                      name: { type: string }
                      startDate: { type: string, format: date, nullable: true }
                      endDate: { type: string, format: date, nullable: true }
                      committed: { type: integer }
                      completed: { type: integer }
                      daysRemaining: { type: integer, nullable: true, description: End date inclusive — a sprint ending today has 1 day left }
                      committedEstimate: { type: number, nullable: true }
                      completedEstimate: { type: number, nullable: true }
                  releases:
                    type: object
                    properties:
                      open: { type: integer }
                      closed: { type: integer }
                      nextDue: { type: string, format: date, nullable: true }
                      nextDueName: { type: string, nullable: true }
                      overdueOpen: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

